on:
    push:
        branches: [main]
    workflow_dispatch: # added for manual trigger, remove once fully built
jobs:
    train:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - name: Run training script in Kaggle server
              uses: Frederisk/kaggle-action@v1.0.0
              with:
                username: ${{ secrets.KAGGLE_USERNAME }}
                key: ${{ secrets.KAGGLE_KEY }}
                title: train
                code_file: train/train.py